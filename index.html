<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var filterVite = function(args) {
          if (!args) return false;
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            if (!arg) continue;
            var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || (typeof arg.toString === 'function' ? arg.toString() : ''));
            if (typeof str === 'string' && (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite:') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('tesseract.js') !== -1 ||
              str.indexOf('worker.min.js') !== -1
            )) {
              return true;
            }
          }
          return false;
        };
        var origError = console.error;
        console.error = function() {
          if (filterVite(arguments)) return;
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          if (filterVite(arguments)) return;
          origWarn.apply(console, arguments);
        };
        var origLog = console.log;
        console.log = function() {
          if (filterVite(arguments)) return;
          origLog.apply(console, arguments);
        };
        var origInfo = console.info;
        console.info = function() {
          if (filterVite(arguments)) return;
          origInfo.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (filterVite([reason])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (filterVite([msg, event && event.error])) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Restrict pinch-to-zoom gestures on iOS Safari / WebKit
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });

        // Restrict multi-touch pinch zooming
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Restrict trackpad/mouse pinch zoom (Ctrl + wheel)
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // Restrict keyboard zoom shortcuts
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Reco App</title>
    <meta name="description" content="Reco - Wholesale Receipt Search and Instant On-Device Inventory Indexer." />
    <meta property="og:title" content="Reco App" />
    <meta property="og:description" content="Reco - Wholesale Receipt Search and Instant On-Device Inventory Indexer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" id="color-scheme-meta" content="light dark" />
    
    <!-- PWA & Mobile Web App Standalone Meta Tags with Material 3 Dynamic System Colors -->
    <meta name="theme-color" id="theme-color-light" media="(prefers-color-scheme: light)" content="#f8f9ff" />
    <meta name="theme-color" id="theme-color-dark" media="(prefers-color-scheme: dark)" content="#10131a" />
    <meta name="theme-color" id="theme-color-meta" content="#10131a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" id="apple-status-bar-meta" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reco" />
    <meta name="application-name" content="Reco" />
    <meta name="msapplication-TileColor" id="ms-tile-color" content="#10131a" />
    
    <style>
      html {
        color-scheme: light dark;
      }
      html, body {
        background-color: #10131a;
        color: #e0e2ec;
        margin: 0;
        padding: 0;
        min-height: 100%;
        overscroll-behavior-y: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        touch-action: pan-x pan-y;
      }
      html:not(.dark), html:not(.dark) body {
        color-scheme: light;
        background-color: #f8f9ff;
        color: #181c22;
      }
      html.dark, html.dark body {
        color-scheme: dark;
        background-color: #10131a;
        color: #e0e2ec;
      }
    </style>

    <!-- Standard Favicon and Apple Touch Icons -->
    <link rel="icon" id="favicon-link" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Standard PWA Web App Manifest for Android WebAPK and Chrome installation -->
    <link rel="manifest" id="manifest-link" href="/manifest.json" />

    <script>
      (function() {
        var savedTheme = null;
        var savedPalette = 'dynamic_system';
        try {
          savedTheme = localStorage.getItem('costco_receipt_theme');
          var p = localStorage.getItem('reco_m3_palette_id');
          if (p) savedPalette = p;
        } catch (e) {}

        var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Default mode is system auto unless explicitly saved as light or dark
        var themeMode = savedTheme || 'system';
        var isDark = themeMode === 'dark' || (themeMode === 'system' ? systemPrefersDark : false);

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }

        // Palette-aware early background color matching Material You & Pixel 9 swatches
        var bgColors = {
          dynamic_system: { dark: '#10131a', light: '#f8f9ff' },
          pixel_slate_blue: { dark: '#10131a', light: '#f8f9ff' },
          plum_taupe: { dark: '#161212', light: '#fff8f7' },
          burgundy_rose: { dark: '#221016', light: '#fff0f3' },
          peach_teal: { dark: '#1d120f', light: '#fff8f6' },
          charcoal_lavender: { dark: '#121318', light: '#f9f9ff' },
          royal_blue_magenta: { dark: '#0e1420', light: '#f8f9ff' },
          cobalt_emerald: { dark: '#0d141e', light: '#f7f9ff' },
          forest_sage: { dark: '#111512', light: '#f7faf4' }
        };

        var activePalette = bgColors[savedPalette] || bgColors.dynamic_system;
        var targetBg = isDark ? activePalette.dark : activePalette.light;

        document.documentElement.style.backgroundColor = targetBg;
        if (document.body) document.body.style.backgroundColor = targetBg;

        var darkMeta = document.getElementById('theme-color-dark');
        var lightMeta = document.getElementById('theme-color-light');
        var baseMeta = document.getElementById('theme-color-meta');
        var colorSchemeMeta = document.getElementById('color-scheme-meta');

        if (themeMode === 'system') {
          if (darkMeta) {
            darkMeta.setAttribute('content', activePalette.dark);
            darkMeta.setAttribute('media', '(prefers-color-scheme: dark)');
          }
          if (lightMeta) {
            lightMeta.setAttribute('content', activePalette.light);
            lightMeta.setAttribute('media', '(prefers-color-scheme: light)');
          }
          if (baseMeta) {
            baseMeta.removeAttribute('media');
            baseMeta.setAttribute('content', targetBg);
          }
          if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', 'light dark');
        } else {
          if (darkMeta) darkMeta.remove();
          if (lightMeta) lightMeta.remove();
          if (baseMeta) {
            baseMeta.removeAttribute('media');
            baseMeta.setAttribute('content', targetBg);
          }
          if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', isDark ? 'dark' : 'light');
        }

        var tileMeta = document.getElementById('ms-tile-color');
        if (tileMeta) tileMeta.setAttribute('content', targetBg);

        var appleStatusMeta = document.getElementById('apple-status-bar-meta');
        if (appleStatusMeta) appleStatusMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');

        var manifestLink = document.getElementById('manifest-link');
        if (manifestLink) {
          manifestLink.setAttribute('href', isDark ? '/manifest-dark.json' : '/manifest-light.json');
        }

        var faviconLink = document.getElementById('favicon-link');
        if (faviconLink) {
          faviconLink.setAttribute('href', isDark ? '/icons/icon-dark-32.png' : '/favicon.png');
        }

        var appleIcon = document.getElementById('apple-touch-icon');
        if (appleIcon) {
          appleIcon.setAttribute('href', isDark ? '/icons/icon-dark-180.png' : '/apple-touch-icon.png');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-m3-background text-m3-on-background antialiased selection:bg-m3-primary selection:text-m3-on-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

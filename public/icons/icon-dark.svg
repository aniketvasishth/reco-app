<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="50%" stop-color="#101724" />
      <stop offset="100%" stop-color="#0B1019" />
    </linearGradient>
    <linearGradient id="receiptGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243147" />
      <stop offset="100%" stop-color="#1A2436" />
    </linearGradient>
    <linearGradient id="accentBeamDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <filter id="glowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#60A5FA" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle luminous border -->
  <rect width="508" height="508" x="2" y="2" rx="126" fill="url(#darkBg)" stroke="#3b5278" stroke-width="4" />
  
  <!-- Ambient blue neon aura in center -->
  <circle cx="256" cy="240" r="160" fill="#3B82F6" fill-opacity="0.12" filter="url(#glowDark)" />

  <!-- Main Receipt Card -->
  <g filter="url(#glowDark)">
    <!-- Receipt Paper -->
    <path d="M 160 110 
             L 352 110 
             Q 360 110 360 118 
             L 360 380 
             L 342 368 
             L 324 380 
             L 306 368 
             L 288 380 
             L 270 368 
             L 252 380 
             L 234 368 
             L 216 380 
             L 198 368 
             L 180 380 
             L 162 368 
             L 152 376 
             L 152 118 
             Q 152 110 160 110 Z" 
          fill="url(#receiptGradDark)" 
          stroke="#4D6B9C" 
          stroke-width="2.5" />

    <!-- Receipt Header Badge "RECO" -->
    <rect x="184" y="136" width="144" height="34" rx="8" fill="#3B82F6" />
    <text x="256" y="160" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="20" 
          fill="#FFFFFF" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          dominant-baseline="central">RECO</text>

    <!-- Receipt Item Lines (High Contrast Neon/Muted) -->
    <rect x="180" y="196" width="104" height="10" rx="5" fill="#93C5FD" />
    <rect x="304" y="196" width="28" height="10" rx="5" fill="#38BDF8" />

    <rect x="180" y="222" width="86" height="10" rx="5" fill="#60A5FA" fill-opacity="0.7" />
    <rect x="304" y="222" width="28" height="10" rx="5" fill="#38BDF8" />

    <rect x="180" y="248" width="112" height="10" rx="5" fill="#93C5FD" />
    <rect x="304" y="248" width="28" height="10" rx="5" fill="#38BDF8" />

    <!-- Dotted Divider Line -->
    <line x1="178" y1="278" x2="334" y2="278" stroke="#4B5563" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" />

    <!-- Total Row -->
    <rect x="180" y="298" width="56" height="12" rx="6" fill="#CBD5E1" />
    <rect x="286" y="296" width="46" height="16" rx="6" fill="#38BDF8" />

    <!-- Scanning Laser Beam with Glow -->
    <rect x="130" y="234" width="252" height="6" rx="3" fill="url(#accentBeamDark)" />
    <circle cx="256" cy="237" r="6" fill="#FFFFFF" filter="url(#glowDark)" />
  </g>
</svg>

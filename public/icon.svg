<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E60D5" />
      <stop offset="50%" stop-color="#144AB2" />
      <stop offset="100%" stop-color="#0E3589" />
    </linearGradient>
    <linearGradient id="receiptGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="accentBeamLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </linearGradient>
    <filter id="cardShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071940" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#lightBg)" />
  
  <!-- Subtle decorative ambient glow -->
  <circle cx="256" cy="140" r="180" fill="#60A5FA" fill-opacity="0.15" />

  <!-- Main Receipt Card centered in safe area -->
  <g filter="url(#cardShadowLight)">
    <!-- Receipt Paper -->
    <path d="M 160 110 
             L 352 110 
             Q 360 110 360 118 
             L 360 380 
             L 342 368 
             L 324 380 
             L 306 368 
             L 288 380 
             L 270 368 
             L 252 380 
             L 234 368 
             L 216 380 
             L 198 368 
             L 180 380 
             L 162 368 
             L 152 376 
             L 152 118 
             Q 152 110 160 110 Z" 
          fill="url(#receiptGradLight)" />

    <!-- Receipt Header Badge "RECO" -->
    <rect x="184" y="136" width="144" height="34" rx="8" fill="#144AB2" />
    <text x="256" y="160" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="20" 
          fill="#FFFFFF" 
          letter-spacing="2.5" 
          text-anchor="middle" 
          dominant-baseline="central">RECO</text>

    <!-- Receipt Item Lines -->
    <rect x="180" y="196" width="104" height="10" rx="5" fill="#64748B" />
    <rect x="304" y="196" width="28" height="10" rx="5" fill="#0F172A" />

    <rect x="180" y="222" width="86" height="10" rx="5" fill="#94A3B8" />
    <rect x="304" y="222" width="28" height="10" rx="5" fill="#0F172A" />

    <rect x="180" y="248" width="112" height="10" rx="5" fill="#64748B" />
    <rect x="304" y="248" width="28" height="10" rx="5" fill="#0F172A" />

    <!-- Dotted Divider Line -->
    <line x1="178" y1="278" x2="334" y2="278" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" />

    <!-- Total Row -->
    <rect x="180" y="298" width="56" height="12" rx="6" fill="#1E293B" />
    <rect x="290" y="296" width="42" height="16" rx="6" fill="#144AB2" />

    <!-- Scanning Laser Beam -->
    <rect x="132" y="234" width="248" height="6" rx="3" fill="url(#accentBeamLight)" />
    <circle cx="256" cy="237" r="5" fill="#FFFFFF" />
  </g>
</svg>
